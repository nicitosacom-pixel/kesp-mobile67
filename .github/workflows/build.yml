
name: Build KESP Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 3 -name "*.zip" -print -quit)
          test -n "$ZIP" || { echo "ZIP not found"; exit 1; }
          mkdir extracted
          unzip -q "$ZIP" -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          find extracted -type f | head -100
          find extracted -type f -name "gradlew"

      - name: Build APK
        run: |
          cd "$(dirname "$(find extracted -name gradlew -type f -print -quit)")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KESP-Mobile-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
