
name: Build KESP Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q kespmobile67_ready_v2.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: extracted/kesp-mobile67-ready
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KESP-Mobile-debug-apk
          path: extracted/kesp-mobile67-ready/app/build/outputs/apk/debug/app-debug.apk
          
