name: Build KESP APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Install Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check and extract Android project
    run: |
      set -eux

      echo "Files in repository:"
      ls -la

      ZIP_FILE="kespmobile67_ready.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ZIP archive not found!"
        exit 1
      fi

      mkdir -p extracted
      unzip -o "$ZIP_FILE" -d extracted

      echo "Searching for Android Gradle project..."

      PROJECT_DIR=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)

      if [ -z "$PROJECT_DIR" ]; then
        echo "Gradle settings file not found!"
        find extracted -maxdepth 6 -type f
        exit 1
      fi

      echo "Android project found: $PROJECT_DIR"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build APK
    run: |
      set -eux
      cd "$PROJECT_DIR"
      gradle assembleDebug --stacktrace

  - name: Find APK
    run: |
      set -eux
      find extracted -type f -name "*.apk" -print

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KESP-Mobile-debug-apk
      path: extracted/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7